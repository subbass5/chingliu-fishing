<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ชิงหลิว บ่อตกปลา</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="theme-color" content="#101410">
    <!-- share card (TikTok, LINE, Facebook, Messenger, Discord, X) -->

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ชิงหลิว บ่อตกปลา">
    <meta property="og:locale" content="th_TH">
    <meta property="og:title" content="ชิงหลิว บ่อตกปลา · เล่นฟรีบนเว็บ">
    <meta property="og:description" content="ดูทุ่น วัดเบ็ด สู้ปลา สะสมปลา 20 ชนิด ไม่มีโฆษณา ไม่ต้องสมัคร เปิดลิงก์แล้วเล่นได้เลย">
    <meta property="og:url" content="https://subbass5.github.io/chingliu-fishing/">
    <meta property="og:image" content="https://subbass5.github.io/chingliu-fishing/TemplateData/og-cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="ทุ่นชิงหลิวสีสะท้อนแสงกลางบ่อตอนเช้า พร้อมชื่อเกม">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ชิงหลิว บ่อตกปลา · เล่นฟรีบนเว็บ">
    <meta name="twitter:description" content="ดูทุ่น วัดเบ็ด สู้ปลา ไม่มีโฆษณา ไม่ต้องสมัคร">
    <meta name="twitter:image" content="https://subbass5.github.io/chingliu-fishing/TemplateData/og-cover.jpg">
    <link rel="canonical" href="https://subbass5.github.io/chingliu-fishing/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ชิงหลิว">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ชิงหลิว บ่อตกปลา</div>
      </div>
    </div>

    <!-- phones held upright: the game is landscape-only -->
    <div id="rotate-hint" aria-live="polite">
      <div class="rotate-phone"></div>
      <div class="rotate-text">หมุนโทรศัพท์เป็นแนวนอน<br><small>เกมนี้เล่นในแนวนอนเท่านั้น</small></div>
    </div>

    <!-- first visit on a phone: suggest adding the game to the home screen -->
    <div id="install-popup" role="dialog" aria-modal="true" aria-labelledby="install-title" hidden>
      <div class="install-card">
        <img class="install-icon" src="TemplateData/icons/icon-192.png" alt="">
        <div class="install-body">
          <div id="install-title" class="install-title">เพิ่มเกมไว้ที่หน้าจอหลัก</div>
          <div id="install-text" class="install-text"></div>
          <div class="install-actions">
            <button id="install-yes" type="button" class="install-btn primary" hidden>ติดตั้ง</button>
            <button id="install-copy" type="button" class="install-btn primary" hidden>คัดลอกลิงก์</button>
            <button id="install-later" type="button" class="install-btn">ไว้ทีหลัง</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // ---------- install popup (shown once, on phones, when not already installed) ----------
      (function () {
        var KEY = "chingliu-install-asked-v1";
        var ua = navigator.userAgent;
        var phone = /iPhone|iPad|iPod|Android/i.test(ua);
        var installed = window.matchMedia("(display-mode: fullscreen)").matches ||
                        window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
        var inApp = /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|TikTok/i.test(ua);
        var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var asked = false;
        try { asked = localStorage.getItem(KEY) === "1"; } catch (e) {}

        var deferred = null;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault(); deferred = e;
          var yes = document.getElementById("install-yes");
          if (yes && !document.getElementById("install-popup").hidden) { yes.hidden = false; setText("android-ready"); }
        });

        if (!phone || installed || asked) return;

        var pop = document.getElementById("install-popup");
        var text = document.getElementById("install-text");
        function setText(kind) {
          text.innerHTML = {
            "in-app": "เบราว์เซอร์ในแอปนี้เล่นเต็มจอไม่ได้<br>แตะ <b>⋯</b> มุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์</b> (Chrome / Safari) จากนั้นเพิ่มเกมไว้ที่หน้าจอหลัก",
            "ios": "เล่นเต็มจอเหมือนแอป:<br>1. แตะปุ่ม <b>แชร์</b> <span class=\"ico\">⬆︎</span> ด้านล่าง<br>2. เลือก <b>เพิ่มไปยังหน้าจอโฮม</b>",
            "android-ready": "ติดตั้งเป็นแอป เปิดมาเต็มจอและเป็นแนวนอนทันที ไม่มีแถบเบราว์เซอร์",
            "android": "เล่นเต็มจอเหมือนแอป:<br>แตะเมนู <b>⋮</b> มุมขวาบน แล้วเลือก <b>เพิ่มลงในหน้าจอหลัก</b> หรือ <b>ติดตั้งแอป</b>"
          }[kind];
        }
        function close() {
          pop.hidden = true;
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
        }

        if (inApp) { setText("in-app"); document.getElementById("install-copy").hidden = false; }
        else if (ios) setText("ios");
        else if (deferred) { setText("android-ready"); document.getElementById("install-yes").hidden = false; }
        else setText("android");

        document.getElementById("install-later").onclick = close;
        document.getElementById("install-yes").onclick = function () {
          if (!deferred) return;
          deferred.prompt();
          deferred.userChoice.finally(function () { deferred = null; close(); });
        };
        document.getElementById("install-copy").onclick = function () {
          var b = this, url = location.href.split("?")[0];
          var done = function () { b.textContent = "คัดลอกแล้ว ✓"; };
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt("คัดลอกลิงก์นี้:", url); });
          else prompt("คัดลอกลิงก์นี้:", url);
        };

        // let the page settle first so Chrome has a chance to offer its install event
        setTimeout(function () { pop.hidden = false; document.getElementById("install-later").focus(); }, 1500);
      })();
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ชิงหลิว บ่อตกปลา",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (isMobile) {
        // phones: the canvas fills the whole screen
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        document.body.classList.add("is-mobile");

        // Android: the first tap goes fullscreen and locks landscape.
        // (Browsers only allow the lock in fullscreen; iPhone Safari and in-app browsers refuse it,
        //  so they fall back to the rotate overlay, which is shown by CSS when the screen is upright.)
        var triedLock = false;
        function goLandscape(ev) {
          if (triedLock) return;
          if (ev && ev.target && ev.target.closest && ev.target.closest("#install-popup")) return;   // popup taps don't count
          triedLock = true;
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (!req) return;
          Promise.resolve(req.call(el, { navigationUI: "hide" }))
            .then(function () {
              if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape");
            })
            .catch(function () { /* not allowed here: the overlay still tells the player to rotate */ });
        }
        document.addEventListener("pointerup", goLandscape, { once: false, passive: true });
        document.addEventListener("touchend", goLandscape, { once: false, passive: true });
      } else if (/[?&]shot=1/.test(location.search)) {
        // photo mode for the share cover (1200x630) or, with &portrait=1, video recording (1080x1920); no footer
        var portrait = /[?&]portrait=1/.test(location.search);
        canvas.style.width = portrait ? "540px" : "1200px"; canvas.style.height = portrait ? "960px" : "630px";
        document.querySelector("#unity-footer").style.display = "none";
        config.devicePixelRatio = portrait ? 2 : 1;

        // recording: copy every sound the game sends to the speakers into a stream we can record
        var origConnect = AudioNode.prototype.connect;
        AudioNode.prototype.connect = function (target) {
          var r = origConnect.apply(this, arguments);
          if (typeof AudioDestinationNode !== "undefined" && target instanceof AudioDestinationNode) {
            var ctx = target.context;
            if (!ctx.__rec) { ctx.__rec = ctx.createMediaStreamDestination(); window.__recAudio = ctx.__rec.stream; }
            origConnect.call(this, ctx.__rec);
          }
          return r;
        };
        // __startRec() / await __stopRec(url): records canvas + game audio as WebM and POSTs it to url
        window.__startRec = function () {
          var s = canvas.captureStream(30);
          if (window.__recAudio) window.__recAudio.getAudioTracks().forEach(function (t) { s.addTrack(t); });
          var mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(function (m) { return MediaRecorder.isTypeSupported(m); });
          window.__chunks = [];
          window.__rec = new MediaRecorder(s, { mimeType: mime, videoBitsPerSecond: 12000000, audioBitsPerSecond: 160000 });
          window.__rec.ondataavailable = function (e) { if (e.data.size) window.__chunks.push(e.data); };
          window.__rec.start(1000);
          return mime + " audio:" + !!window.__recAudio;
        };
        window.__stopRec = function (url) {
          return new Promise(function (done) {
            window.__rec.onstop = function () {
              var blob = new Blob(window.__chunks, { type: "video/webm" });
              fetch(url, { method: "POST", body: blob }).then(function (r) { return r.text(); }).then(done, function (e) { done("upload failed: " + e); });
            };
            window.__rec.stop();
          });
        };
        config.webglContextAttributes = { preserveDrawingBuffer: true };   // lets the cover be read back from the canvas
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
